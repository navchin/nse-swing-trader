name: NSE Swing Scanner

on:
  schedule:
    - cron: "45 3 * * 1-5"    # 9:15 AM IST (3:45 AM UTC) - MORNING
    - cron: "45 9 * * 1-5"    # 3:15 PM IST (9:45 AM UTC) - EVENING
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'manual override: morning or evening'
        required: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect scan type
        id: scan_type
        run: |
          HOUR=$(date -u +%H)
          MANUAL="${{ github.event.inputs.scan_type }}"
          if [ "$MANUAL" != "" ]; then
            echo "type=$MANUAL" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -lt "6" ]; then
            echo "type=morning" >> $GITHUB_OUTPUT
          else
            echo "type=evening" >> $GITHUB_OUTPUT
          fi

      - name: Run morning scan (find new signals)
        if: steps.scan_type.outputs.type == 'morning'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_TYPE: morning
        run: python main.py

      - name: Run evening scan (check open trades)
        if: steps.scan_type.outputs.type == 'evening'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_TYPE: evening
        run: python main.py

      - name: Save paper trades CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-trades-${{ github.run_number }}
          path: paper_trades.csv
          retention-days: 90